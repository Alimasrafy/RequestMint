<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | RequestMint</title>
    <meta name="theme-color" content="#07111c" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0; min-height: 100vh; background: #07111c; color: #e2e8f0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center;
      }
      a { color: #67e8f9; text-decoration: underline; }
      .card { background: white/[0.03]; border: 1px solid white/5; border-radius: 24px; padding: 40px; max-width: 420px; }
      h1 { font-size: 2rem; font-weight: 800; margin: 0 0 12px; letter-spacing: -0.02em; }
      p { color: #94a3b8; margin: 0 0 24px; line-height: 1.6; }
      .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        background: #6366f1; color: #fff; padding: 12px 24px; border-radius: 10px;
        font-weight: 600; text-decoration: none; transition: transform 0.2s, background 0.2s;
      }
      .btn:hover { background: #4f46e5; transform: translateY(-1px); }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>404</h1>
      <p>The page you're looking for doesn't exist. Head back to the homepage and turn your customer requests into revenue.</p>
      <a href="/" class="btn">Go to Homepage <span aria-hidden="true">→</span></a>
    </div>
  </body>
</html>
